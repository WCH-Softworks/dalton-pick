name: Wrong or confusing color name
description: DaltonPick named a color in a way that seems wrong or unhelpful.
labels: [color-name]
body:
  - type: markdown
    attributes:
      value: Issues are public. Crop screenshots so they show only the color, nothing personal.
  - type: input
    id: hex
    attributes:
      label: The color
      description: The hex code DaltonPick showed (turn on "Show hex and RGB values" in settings), or attach a cropped screenshot below.
      placeholder: "#6B8E23"
    validations:
      required: true
  - type: input
    id: shown
    attributes:
      label: Name DaltonPick showed
    validations:
      required: true
  - type: input
    id: expected
    attributes:
      label: Name you'd expect
  - type: dropdown
    id: lang
    attributes:
      label: App language
      options: [English, Español, Português (Brasil)]
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Optional. Your type of color vision, if you're comfortable sharing it, helps us understand the report.
