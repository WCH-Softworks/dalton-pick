# Publishes site/ to GitHub Pages (https://wch-softworks.github.io/dalton-pick/).
# The privacy pages come from docs/store/privacy-policy.*.md via site/build.sh.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/store/privacy-policy.*.md
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Copy the privacy policies into the site
        run: bash site/build.sh
      - uses: actions/configure-pages@v6
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./site
          destination: ./_site
      - uses: actions/upload-pages-artifact@v5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
