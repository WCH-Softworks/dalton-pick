# GitHub Pages site for DaltonPick, built by .github/workflows/pages.yml.
# The privacy pages are copied in from docs/store/ by site/build.sh before Jekyll runs.
title: DaltonPick
url: https://wch-softworks.github.io
baseurl: /dalton-pick
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

# Fill these in as they come to exist; the home pages show whichever is set.
play_url: ""          # Play Store listing, once the app is public
tester_group_url: "https://groups.google.com/g/daltonpick-testers"  # Google Group testers join first
tester_optin_url: "https://play.google.com/apps/testing/com.wchsoftworks.daltonpick"  # Play "Become a tester" page for the closed track

github_url: https://github.com/WCH-Softworks/dalton-pick
issues_url: https://github.com/WCH-Softworks/dalton-pick/issues/new/choose
kofi_url: https://ko-fi.com/willcaphir

exclude: [build.sh]
defaults:
  - scope: { path: "" }
    values: { layout: default }
